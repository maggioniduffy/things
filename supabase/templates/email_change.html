<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #f3f4f6;
      font-family: Inter, Helvetica, Arial, sans-serif;
      color: #0f0f12;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 420px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e3e3e6;
        border-radius: 14px;
      "
    >
      <tr>
        <td style="padding: 32px">
          <p style="margin: 0 0 24px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">
            Things
          </p>
          <p style="margin: 0 0 8px; font-size: 17px; font-weight: 500">Confirm your new email</p>
          <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.5; color: #4a4a52">
            Enter this code in Things to confirm the new email address for your account.
          </p>
          <p style="margin: 0 0 20px; font-size: 32px; font-weight: 600; letter-spacing: 0.18em">
            {{ .Token }}
          </p>
          <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #8b8b94">
            The code expires in 10 minutes. If you didn't ask for it, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
